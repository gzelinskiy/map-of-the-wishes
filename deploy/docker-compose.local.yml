# Локальний тест стеку без домену/TLS:
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up -d --build
# Відкрити: http://localhost:8080
services:
  server:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  caddy:
    ports: !override
      - "8080:80"
    environment:
      SITE_ADDRESS: ":80"
