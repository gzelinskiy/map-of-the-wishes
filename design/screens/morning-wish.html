<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=Lora:ital,wght@0,400;1,400&amp;family=Manrope:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:#0B0F2A;color:#F5EEDF}
a{color:inherit}
button{font-family:inherit}
button:disabled{opacity:0.35;cursor:default}
.tw{animation:tw 4s ease-in-out infinite both}
@keyframes tw{0%,100%{opacity:0.2}50%{opacity:1}}
.glow{animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:0.35}50%{opacity:0.9}}
.shoot{animation:shoot 9s ease-in infinite;opacity:0}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}9%{transform:translate(var(--dx),var(--dy));opacity:0}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.drift{animation:drift 22s ease-in-out infinite alternate}
.drift2{animation:drift 30s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(28px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.rise{animation:rise 2.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(70px);opacity:0.4}to{transform:none;opacity:1}}
.up{animation:up 1s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes up{from{transform:translateY(16px);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
.draw{animation:draw 3.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 0.7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.bird{animation:fly 22s linear infinite}
@keyframes fly{from{transform:translate(-80px,20px)}to{transform:translate(480px,-70px)}}
.flap{transform-box:fill-box;transform-origin:center;animation:flap 0.55s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-0.35)}}
.mote{animation:mote 10s ease-in-out infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}25%{opacity:0.95}100%{transform:translate(22px,-170px);opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 6s ease-out infinite both}
@keyframes ring{0%{transform:scale(1);opacity:0.55}100%{transform:scale(2.6);opacity:0}}
.glint{transform-box:fill-box;transform-origin:center;animation:glint 4.5s ease-in-out infinite both}
@keyframes glint{0%,100%{transform:scale(0) rotate(0deg);opacity:0}45%{transform:scale(1) rotate(45deg);opacity:1}60%{transform:scale(0.6) rotate(70deg);opacity:0.6}}
.cross{animation:cross 70s linear infinite}
@keyframes cross{from{transform:translateX(-180px)}to{transform:translateX(480px)}}
.nightfade{animation:nightfade 3.4s ease-in 0.3s both;pointer-events:none}
@keyframes nightfade{from{opacity:1}to{opacity:0}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.firefly{animation:ff 5s ease-in-out infinite alternate}
@keyframes ff{0%{transform:translate(0,0);opacity:0.1}50%{opacity:1}100%{transform:translate(16px,-20px);opacity:0.25}}
.sunup{animation:sunup 1.6s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes sunup{from{transform:translateY(30px) scale(0.7);opacity:0}to{transform:none;opacity:1}}
.press{transition:transform .2s ease, box-shadow .3s ease}
.press:active{transform:scale(0.96)}
@media (prefers-reduced-motion: reduce){.tw,.glow,.shoot,.drift,.drift2,.spin,.breathe,.rise,.up,.draw,.pop,.bird,.flap,.mote,.ring,.glint,.cross,.pulse,.firefly,.sunup{animation:none!important}.shoot,.mote,.bird,.nightfade,.ring,.glint{display:none}}
</style>

<script>
// ДЕМО-ДАНІ. На реальному сайті — завантажуйте з data/wishes.json (див. DESIGN-SPEC.md)
var T = { accent: "#B8506A", muted: "#5E4A63", body: "#2A1F3D" };
var letters = [{"date": "17 вересня", "short": "17 вер", "text": "Доброго ранку! Прокидайся потихеньку, потягнись і усміхнись — новий день уже чекає на тебе.\nНехай він буде легким і теплим."}, {"date": "18 вересня", "short": "18 вер", "text": "Добрий ранок, сонечко! Кава, сонце у вікні й гарний настрій — ось що я тобі сьогодні бажаю.\nУсе вийде, я в тебе вірю."}, {"date": "19 вересня", "short": "19 вер", "text": "Доброго ранку, моя хороша! Нехай сьогодні буде день маленьких приємностей.\nІ хай кожна з них нагадає тобі, що про тебе думають."}];
var pos = [{x:22,y:40},{x:110,y:16},{x:198,y:34}];
var HERO = "<svg class=\"sunup\" width=\"80\" height=\"80\" viewBox=\"0 0 80 80\" aria-hidden=\"true\"><circle class=\"glow\" cx=\"40\" cy=\"40\" r=\"38\" fill=\"#FFFFFF\" opacity=\"0.3\"></circle><g class=\"spin\"><g class=\"pulse\"><g stroke=\"#E0826A\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M62.0 40.0 L70.0 40.0\"></path><path d=\"M59.1 51.0 L66.0 55.0\"></path><path d=\"M51.0 59.1 L55.0 66.0\"></path><path d=\"M40.0 62.0 L40.0 70.0\"></path><path d=\"M29.0 59.1 L25.0 66.0\"></path><path d=\"M20.9 51.0 L14.0 55.0\"></path><path d=\"M18.0 40.0 L10.0 40.0\"></path><path d=\"M20.9 29.0 L14.0 25.0\"></path><path d=\"M29.0 20.9 L25.0 14.0\"></path><path d=\"M40.0 18.0 L40.0 10.0\"></path><path d=\"M51.0 20.9 L55.0 14.0\"></path><path d=\"M59.1 29.0 L66.0 25.0\"></path></g></g></g><circle cx=\"40\" cy=\"40\" r=\"16\" fill=\"#F7B267\"></circle></svg>";
var NAV_ON = "<svg class=\"pop\" width=\"30\" height=\"30\" viewBox=\"0 0 30 30\" aria-hidden=\"true\"><g><circle cx=\"15\" cy=\"15\" r=\"6.5\" fill=\"#F7B267\"></circle><g stroke=\"#C2555E\" stroke-width=\"1.6\" stroke-linecap=\"round\"><path d=\"M24.0 15.0 L27.5 15.0\"></path><path d=\"M21.4 21.4 L23.8 23.8\"></path><path d=\"M15.0 24.0 L15.0 27.5\"></path><path d=\"M8.6 21.4 L6.2 23.8\"></path><path d=\"M6.0 15.0 L2.5 15.0\"></path><path d=\"M8.6 8.6 L6.2 6.2\"></path><path d=\"M15.0 6.0 L15.0 2.5\"></path><path d=\"M21.4 8.6 L23.8 6.2\"></path></g></g></svg>";
var NAV_OFF = "<svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5\" fill=\"#9A6A7E\" opacity=\"0.8\"></circle></svg>";
var i = letters.length - 1;
function esc(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function render(){
  var l = letters[i];
  document.getElementById('date').textContent = l.date;
  var paras = l.text.split('\n').map(function(t,j){
    return '<p class="up" style="margin: 0; font-family: Lora, Georgia, serif; font-size: 19px; line-height: 1.75; color: '+T.body+'; animation-delay: '+(0.35+j*0.35).toFixed(2)+'s;">'+esc(t)+'</p>';
  }).join('');
  document.getElementById('wish').innerHTML = '<div style="position: relative; margin-top: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px;">'+HERO+'</div><article style="position: relative; padding: 22px 28px 0 28px; display: flex; flex-direction: column; gap: 14px;">'+paras+'</article>';
  document.getElementById('nav').innerHTML = letters.map(function(x,k){
    var on = k===i;
    return '<button type="button" data-k="'+k+'" aria-label="'+esc(x.date)+'"'+(on?' aria-current="true"':'')+' style="position: absolute; left: '+(pos[k].x-22)+'px; top: '+(pos[k].y-22)+'px; width: 44px; height: 44px; padding: 0; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center;">'+(on?NAV_ON:NAV_OFF)+'</button>'
      +'<div style="position: absolute; left: '+(pos[k].x-30)+'px; top: '+(pos[k].y+18)+'px; width: 60px; text-align: center; font-family: Caveat, cursive; font-size: 17px; line-height: 1; color: '+(on?T.accent:T.muted)+';">'+esc(x.short)+'</div>';
  }).join('');
  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').disabled = i===letters.length-1;
}
function go(k){ if(k>=0 && k<letters.length && k!==i){ i=k; render(); } }
document.getElementById('prev').onclick=function(){go(i-1);};
document.getElementById('next').onclick=function(){go(i+1);};
document.getElementById('nav').onclick=function(e){var b=e.target.closest('button[data-k]'); if(b) go(+b.dataset.k);};
// свайп вліво/вправо
var sx=null;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) go(dx<0?i+1:i-1); sx=null; });
render();
</script>
