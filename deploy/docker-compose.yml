services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ../data:/data          # chown 1000:1000 ../data  (користувач node у контейнері)

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    depends_on: [server]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
